<h1>Secure DMS — Login</h1>
<input id="employee-id" placeholder="Employee ID" />
<input id="password" type="password" placeholder="Password" />
<button onclick="login()">Log In</button>
<div id="status"></div>

<script>
const API = "https://alliance-cqnf.onrender.com";

async function login() {
  const employee_id = document.getElementById("employee-id").value;
  const password = document.getElementById("password").value;
  const statusDiv = document.getElementById("status");

  try {
    const res = await fetch(`${API}/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ employee_id, password }),
    });
    const data = await res.json();

    if (!res.ok) {
      statusDiv.className = "error";
      statusDiv.textContent = data.detail;
      return;
    }

    sessionStorage.setItem("token", data.token);
    sessionStorage.setItem("full_name", data.full_name);
    sessionStorage.setItem("department_type", data.department_type);
    sessionStorage.setItem("department_name", data.department_name);
    sessionStorage.setItem("is_admin", data.is_admin);
    sessionStorage.setItem("has_2fa", data.has_2fa);

    if (data.account_status === "activated" || data.account_status === "profile_pending") {
      window.location.href = "profile-setup.html";
    } else {
      const params = new URLSearchParams(window.location.search);
      const redirectTo = params.get("redirect");
      window.location.href = redirectTo ? decodeURIComponent(redirectTo) : "homepage.html";
    }
  } catch (err) {
    statusDiv.className = "error";
    statusDiv.textContent = `Could not reach the server: ${err.message}`;
  }
}
</script>
