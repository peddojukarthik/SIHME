<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secure DMS</title>
<style>
body{font-family:system-ui;max-width:900px;margin:25px auto;padding:0 18px;background:#f8fafc;color:#172033}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;padding-bottom:15px}
.card{background:#fff;border:1px solid #dbe2ea;border-radius:14px;padding:20px;margin:14px 0}
button,.btn{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-block}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin:7px 0}
.row{padding:12px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:10px}
.meta{color:#64748b;font-size:.86rem}.tag{font-size:.72rem;background:#e0e7ff;padding:3px 8px;border-radius:99px}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center}
.modalbox{background:#fff;padding:24px;border-radius:14px;width:min(600px,92vw);max-height:85vh;overflow:auto}
.item{padding:10px;border-bottom:1px solid #eee}
.error{color:#991b1b}.success{color:#065f46}
</style>
</head>
<body>
<header><div><b id="full-name">Loading…</b><div class="meta" id="dept-name"></div></div>
<button onclick="openNotifications()">🔔 <span id="count">0</span></button></header>

<div id="content"></div>

<div id="inviteModal" class="modal"><div class="modalbox">
<h2>Invite Employee</h2><p class="meta">A 6-digit verification code will be sent to your official email. Your authenticator 2FA must also be completed.</p>
<input id="employeeSearch" placeholder="Search employee name or ID">
<div id="employees"></div><button onclick="closeModal('inviteModal')">Close</button>
</div></div>

<div id="otpModal" class="modal"><div class="modalbox">
<h2>Verify invitation</h2><p>Enter the 6-digit code sent to your official email.</p>
<input id="otp" maxlength="6" inputmode="numeric" placeholder="6-digit code">
<button onclick="finishInvite()">Verify & Send Invitation</button>
<p id="otpmsg" class="error"></p>
</div></div>

<div id="notifModal" class="modal"><div class="modalbox">
<h2>Notifications</h2><div id="notifications"></div>
<button onclick="closeModal('notifModal')">Close</button>
</div></div>

<script>
const API = "http://127.0.0.1:8000";
const token = sessionStorage.getItem("token");
const H = { "Authorization": "Bearer " + token };

const contentEl = document.getElementById("content");
const userNameEl = document.getElementById("full-name");
const deptNameEl = document.getElementById("dept-name");
const countEl = document.getElementById("count");

if (!token) {
    window.location.href = "login.html";
}

function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
    }[c]));
}

function readableError(data, fallback) {
    if (!data) return fallback;
    if (typeof data.detail === "string") return data.detail;
    if (Array.isArray(data.detail)) {
        return data.detail.map(x => {
            const field = Array.isArray(x.loc) ? x.loc.join(".") : "field";
            return field + ": " + (x.msg || JSON.stringify(x));
        }).join("; ");
    }
    return data.message || JSON.stringify(data);
}

async function api(path, options = {}) {
    const headers = { ...(options.headers || {}), ...H };
    const response = await fetch(API + path, { ...options, headers });

    const raw = await response.text();
    let data = {};
    try { data = raw ? JSON.parse(raw) : {}; }
    catch { data = { detail: raw }; }

    if (!response.ok) {
        throw new Error("HTTP " + response.status + ": " + readableError(data, "Request failed."));
    }
    return data;
}

async function loadHomepage() {
    try {
        const me = await api("/me");

        // Explicit DOM references — no window.name/global-ID ambiguity.
        userNameEl.textContent = me.full_name || "User";
        deptNameEl.textContent =
            (me.department_name || "Department") +
            " · " +
            (me.is_admin ? "Department Head" : "Officer");

        sessionStorage.setItem("full_name", me.full_name || "");
        sessionStorage.setItem("department_type", me.department_type || "");
        sessionStorage.setItem("department_name", me.department_name || "");
        sessionStorage.setItem("is_admin", String(!!me.is_admin));

        const cases = await api("/case/my");
        let html = "";

        if (me.department_type === "police") {
            html += `
            <div class="card">
                <h2>File a New FIR</h2>
                <p class="meta">The form becomes an official signed PDF and is stored inside its case.</p>
                <a class="btn" href="file-fir.html">File FIR</a>
            </div>`;
        }

        if (me.is_admin) {
            html += `
            <div class="card">
                <h2>Invite Employee</h2>
                <p class="meta">Search an employee and send an activation email. Email OTP is required before the invitation is created.</p>
                <button id="inviteOpenBtn">Invite Employee</button>
            </div>`;
        }

        html += `
        <div class="card">
            <h2>Case Search</h2>
            <p class="meta">Search returns case metadata only. Files remain protected by case membership.</p>
            <input id="caseSearchInput" placeholder="Search FIR number or case ID" autocomplete="off">
            <div id="caseSearchResults"></div>
        </div>`;

        html += `
        <div class="card">
            <h2>My Cases (${cases.length})</h2>
            ${
                cases.length
                ? cases.map(c => `
                    <a href="case-detail.html?case_id=${encodeURIComponent(c.case_id)}" style="text-decoration:none;color:inherit">
                        <div class="row">
                            <span>
                                <b>${esc(c.cases?.fir_id || c.case_id)}</b><br>
                                <span class="meta">${esc(c.cases?.status || "")}</span>
                            </span>
                            <span class="tag">${esc(c.permission_level)}</span>
                        </div>
                    </a>`).join("")
                : `<p class="meta">No cases.</p>`
            }
        </div>`;

        contentEl.innerHTML = html;

        const newSearch = document.getElementById("caseSearchInput");
        const newResults = document.getElementById("caseSearchResults");

        let searchTimer;
        newSearch.addEventListener("input", function() {
            clearTimeout(searchTimer);
            const q = newSearch.value.trim();

            if (q.length < 2) {
                newResults.innerHTML = "";
                return;
            }

            searchTimer = setTimeout(async () => {
                try {
                    const data = await api("/case/search?q=" + encodeURIComponent(q));
                    newResults.innerHTML = data.length
                        ? data.map(x => `
                            <div class="item">
                                <b>${esc(x.fir_id || "Case")}</b>
                                <div class="meta">${esc(x.status || "")} · ${esc(x.created_at || "")}</div>
                                <a href="case-detail.html?case_id=${encodeURIComponent(x.case_id)}">
                                    Open case
                                </a>
                            </div>`).join("")
                        : `<p class="meta">No cases found.</p>`;
                } catch (error) {
                    newResults.innerHTML = `<p class="error">${esc(error.message)}</p>`;
                }
            }, 250);
        });

        const inviteBtn = document.getElementById("inviteOpenBtn");
        if (inviteBtn) inviteBtn.addEventListener("click", openInvite);

        await countNotifications();

    } catch (error) {
        contentEl.innerHTML = `<div class="card error">${esc(error.message)}</div>`;
        userNameEl.textContent = "Unable to load";
    }
}

function openInvite() {
    const modal = document.getElementById("inviteModal");
    if (modal) modal.style.display = "flex";
}

function closeModal(id) {
    const el = document.getElementById(id);
    if (el) el.style.display = "none";
}

let employeeTimer;
let selectedEmployee = null;

const employeeSearchEl = document.getElementById("employeeSearch");
const employeesEl = document.getElementById("employees");
const otpEl = document.getElementById("otp");
const otpMsgEl = document.getElementById("otpmsg");
const otpModalEl = document.getElementById("otpModal");

if (employeeSearchEl) {
    employeeSearchEl.addEventListener("input", function() {
        clearTimeout(employeeTimer);
        const q = employeeSearchEl.value.trim();
        if (q.length < 2) {
            employeesEl.innerHTML = "";
            return;
        }

        employeeTimer = setTimeout(async () => {
            try {
                const data = await api("/employees/search?q=" + encodeURIComponent(q));
                employeesEl.innerHTML = data.length
                    ? data.map(x => `
                        <div class="item">
                            <b>${esc(x.full_name)}</b>
                            <div class="meta">${esc(x.employee_id)} · ${esc(x.official_email)}</div>
                            <button type="button" data-employee="${esc(x.employee_id)}">Select</button>
                        </div>`).join("")
                    : `<p class="meta">No eligible employees.</p>`;

                employeesEl.querySelectorAll("button[data-employee]").forEach(btn => {
                    btn.addEventListener("click", () => selectEmployee(btn.dataset.employee));
                });
            } catch (error) {
                employeesEl.innerHTML = `<p class="error">${esc(error.message)}</p>`;
            }
        }, 250);
    });
}

async function selectEmployee(employeeId) {
    selectedEmployee = employeeId;
    try {
        const data = await api("/security/request-otp", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({purpose: "APP_INVITE"})
        });

        closeModal("inviteModal");
        otpMsgEl.textContent = data.message || "Enter the code sent to your official email.";
        otpEl.value = "";
        otpModalEl.style.display = "flex";
    } catch (error) {
        alert(error.message);
    }
}

const verifyInviteOtpBtn = document.getElementById("verifyInviteOtp");
if (verifyInviteOtpBtn) {
    verifyInviteOtpBtn.addEventListener("click", finishInvite);
}

async function finishInvite() {
    if (!selectedEmployee) {
        otpMsgEl.textContent = "Select an employee first.";
        return;
    }

    try {
        await api("/security/verify-otp", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({purpose: "APP_INVITE", code: otpEl.value.trim()})
        });

        await api("/invite", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({employee_id: selectedEmployee})
        });
    } catch (error) {
        otpMsgEl.textContent = error.message;
        return;
    }

    closeModal("otpModal");
    alert("Invitation sent. The employee will receive an activation email.");
    await countNotifications();
}

async function countNotifications() {
    try {
        const data = await api("/notifications/unread-count");
        countEl.textContent = data.count || 0;
    } catch {}
}

async function openNotifications() {
    const modal = document.getElementById("notifModal");
    const list = document.getElementById("notifications");
    modal.style.display = "flex";

    try {
        const data = await api("/notifications");
        list.innerHTML = data.length
            ? data.map(x => `
                <div class="item">
                    <b>${esc(x.title)}</b>
                    <div>${esc(x.message)}</div>
                    <small class="meta">${esc(x.created_at)}</small>
                </div>`).join("")
            : `<p class="meta">No notifications.</p>`;

        await api("/notifications/read", {method:"POST"});
        await countNotifications();
    } catch (error) {
        list.innerHTML = `<p class="error">${esc(error.message)}</p>`;
    }
}

const notifButton = document.getElementById("notifButton");
if (notifButton) notifButton.addEventListener("click", openNotifications);

loadHomepage();
setInterval(countNotifications, 30000);
</script>
</body></html>
