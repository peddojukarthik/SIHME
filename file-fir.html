<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>File an FIR</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 20px; color: #1a1a1a; }
  h1 { font-size: 1.3rem; }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin-top: 14px; }
  input, textarea { width: 100%; padding: 9px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; }
  textarea { min-height: 100px; resize: vertical; }
  button { margin-top: 18px; padding: 10px 18px; border: none; border-radius: 6px; background: #2563eb; color: white; cursor: pointer; width: 100%; }
  button:disabled { background: #93b4f0; cursor: not-allowed; }
  #status { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 0.9rem; display: none; }
  #status.success { background: #ecfdf5; color: #065f46; display: block; }
  #status.error { background: #fef2f2; color: #991b1b; display: block; }
  a.back { font-size: 0.85rem; color: #2563eb; }
</style>
</head>
<body>

<a class="back" href="homepage.html">← Back to homepage</a>
<h1>File a New FIR</h1>
<p style="color:#666; font-size:0.9rem;">Your FIR number will be generated automatically once submitted — this form becomes the case's first signed document.</p>

<form id="fir-form">
  <label>Complainant Name</label>
  <input id="complainant_name" required />

  <label>Incident Type</label>
  <input id="incident_type" placeholder="e.g. Theft, Assault, Fraud" required />

  <label>Incident Date</label>
  <input id="incident_date" type="date" required />

  <label>Location</label>
  <input id="location" required />

  <label>Description</label>
  <textarea id="description" required></textarea>

  <button type="submit" id="submit-btn">File FIR</button>
</form>
<div id="status"></div>

<script>
const API = "http://localhost:8000";
const token = sessionStorage.getItem("token");
if (!token) window.location.href = "login.html?redirect=" + encodeURIComponent("file-fir.html");

document.getElementById("fir-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submit-btn");
  const statusDiv = document.getElementById("status");
  btn.disabled = true;
  btn.textContent = "Filing…";

  const body = {
    complainant_name: document.getElementById("complainant_name").value,
    incident_type: document.getElementById("incident_type").value,
    incident_date: document.getElementById("incident_date").value,
    location: document.getElementById("location").value,
    description: document.getElementById("description").value,
  };

  try {
    const res = await fetch(`${API}/case/create`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
      body: JSON.stringify(body),
    });
    const data = await res.json();

    if (res.ok) {
      statusDiv.className = "success";
      statusDiv.textContent = `FIR filed: ${data.fir_id}`;
      setTimeout(() => window.location.href = `case-detail.html?case_id=${data.case_id}`, 1200);
    } else {
      statusDiv.className = "error";
      statusDiv.textContent = data.detail;
      btn.disabled = false;
      btn.textContent = "File FIR";
    }
  } catch (err) {
    statusDiv.className = "error";
    statusDiv.textContent = `Could not reach the server: ${err.message}`;
    btn.disabled = false;
    btn.textContent = "File FIR";
  }
});
</script>

</body>
</html>
