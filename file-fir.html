<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>File an FIR</title>
<style>
body{font-family:system-ui,sans-serif;max-width:600px;margin:40px auto;padding:0 20px;color:#172033;background:#f8fafc}
.card{background:white;border:1px solid #dbe3ef;border-radius:14px;padding:24px;box-shadow:0 3px 12px #0000000b}
h1{margin-top:0}
label{display:block;font-weight:600;margin-top:14px}
input,textarea{width:100%;box-sizing:border-box;padding:11px;margin-top:6px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}
textarea{min-height:130px;resize:vertical}
button{width:100%;padding:12px;margin-top:18px;border:0;border-radius:8px;background:#2563eb;color:white;font-size:1rem;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.status{display:none;margin-top:14px;padding:12px;border-radius:8px}
.success{display:block;background:#ecfdf5;color:#065f46}
.error{display:block;background:#fef2f2;color:#991b1b}
.back{color:#2563eb;text-decoration:none}
</style>
</head>
<body>

<a class="back" href="homepage.html">← Back to homepage</a>

<div class="card">
<h1>File a New FIR</h1>
<p>The submitted form is converted into an official FIR PDF, SHA-256 hashed, digitally signed, and stored under the new case.</p>

<form id="fir-form">
<label>Complainant Name</label>
<input id="complainant_name" required>

<label>Incident Type</label>
<input id="incident_type" placeholder="e.g. Theft, Assault, Fraud" required>

<label>Incident Date</label>
<input id="incident_date" type="date" required>

<label>Location</label>
<input id="location" required>

<label>Description</label>
<textarea id="description" required></textarea>

<button id="submit-btn" type="submit">File FIR</button>
</form>

<div id="status" class="status"></div>
</div>

<script>
const API = "https://alliance-cqnf.onrender.com";
const token = sessionStorage.getItem("token");

if (!token) {
  window.location.href =
    "login.html?redirect=" +
    encodeURIComponent("file-fir.html");
}

const form = document.getElementById("fir-form");
const button = document.getElementById("submit-btn");
const statusBox = document.getElementById("status");

function showStatus(message, ok) {
  statusBox.textContent = message;
  statusBox.className = "status " + (ok ? "success" : "error");
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  button.disabled = true;
  button.textContent = "Creating official FIR…";
  statusBox.className = "status";

  const body = {
    complainant_name:
      document.getElementById("complainant_name").value.trim(),

    incident_type:
      document.getElementById("incident_type").value.trim(),

    incident_date:
      document.getElementById("incident_date").value,

    location:
      document.getElementById("location").value.trim(),

    description:
      document.getElementById("description").value.trim()
  };

  try {
    const response = await fetch(`${API}/case/create`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify(body)
    });

    let data = {};
    try {
      data = await response.json();
    } catch (_) {}

    if (!response.ok) {
      let message = data.detail;

      if (Array.isArray(message)) {
        message = message
          .map(x => x.msg || JSON.stringify(x))
          .join("; ");
      }

      if (typeof message === "object" && message !== null) {
        message = JSON.stringify(message);
      }

      showStatus(
        message || `Request failed (${response.status})`,
        false
      );

      button.disabled = false;
      button.textContent = "File FIR";
      return;
    }

    showStatus(
      `FIR ${data.fir_id || ""} filed successfully. Opening the case…`,
      true
    );

    setTimeout(() => {
      window.location.href =
        `case-detail.html?case_id=${encodeURIComponent(data.case_id)}`;
    }, 900);

  } catch (error) {
    showStatus(
      "Could not reach the backend: " + error.message,
      false
    );

    button.disabled = false;
    button.textContent = "File FIR";
  }
});
</script>

</body>
</html>
